<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>FinanzaPro AI</title>
  <meta name="description" content="Finanzas personales y de microempresa con IA integrada." />

  <!-- Metadatos PWA -->
  <meta name="theme-color" content="#1E3A8A" />
  <meta name="color-scheme" content="light" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="application-name" content="FinanzaPro AI" />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- React & React-DOM CDNs -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <!-- Babel Standalone -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Recharts CDN (Gráficos interactivos) -->
  <script src="https://unpkg.com/recharts@2.12.7/umd/Recharts.js"></script>

  <!-- SheetJS & PapaParse CDNs (Archivos Excel y CSV) -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    :root { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #F8F9FA;
      -webkit-tap-highlight-color: transparent;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useMemo, useRef, useEffect } = React;
    const { 
      PieChart, Pie, Cell, ResponsiveContainer, Tooltip, LineChart, Line, 
      XAxis, YAxis, CartesianGrid, Legend, BarChart, Bar 
    } = Recharts;

    /* COMPONENTE DE ICONOS LUCIDE */
    const LucideIcon = ({ name, size = 20, color = "currentColor", className = "", style = {} }) => {
      const iconRef = useRef(null);
      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      }, [name]);

      const formattedName = name ? name.replace(/([a-z0-9])([A-Z])/g, '$1-$2').toLowerCase() : 'more-horizontal';
      return <i ref={iconRef} data-lucide={formattedName} className={className} style={{ fontSize: size, color: color, display: 'inline-flex', verticalAlign: 'middle', width: size, height: size, ...style }}></i>;
    };

    /* ALMACENAMIENTO PERSISTENTE LOCAL */
    const STORAGE_KEY = "finanzapro_state_v1";
    const Store = {
      async load() {
        try {
          const res = localStorage.getItem(STORAGE_KEY);
          return res ? JSON.parse(res) : null;
        } catch (e) { return null; }
      },
      async save(payload) {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
          return true;
        } catch (e) { return false; }
      },
      async clear() {
        try {
          localStorage.removeItem(STORAGE_KEY);
          return true;
        } catch (e) { return false; }
      },
    };

    /* RECONOCIMIENTO Y SÍNTESIS DE VOZ */
    const SpeechRecognitionAPI = typeof window !== "undefined" ? (window.SpeechRecognition || window.webkitSpeechRecognition) : null;
    const voiceInputSupported = !!SpeechRecognitionAPI;
    const voiceOutputSupported = typeof window !== "undefined" && !!window.speechSynthesis;

    function recognizeSpeech({ onResult, onError, onEnd }) {
      if (!SpeechRecognitionAPI) { onError && onError("unsupported"); return null; }
      const rec = new SpeechRecognitionAPI();
      rec.lang = "es-MX";
      rec.interimResults = false;
      rec.maxAlternatives = 1;
      rec.onresult = (e) => onResult(e.results[0][0].transcript);
      rec.onerror = (e) => onError && onError(e.error);
      rec.onend = () => onEnd && onEnd();
      try { rec.start(); } catch (e) { onError && onError("start_failed"); }
      return rec;
    }

    function speak(text) {
      if (!voiceOutputSupported || !text) return;
      try {
        window.speechSynthesis.cancel();
        const utter = new SpeechSynthesisUtterance(text);
        utter.lang = "es-MX";
        utter.rate = 1;
        window.speechSynthesis.speak(utter);
      } catch (e) {}
    }

    /* CONFIGURACIÓN DE CATEGORÍAS Y TEMAS */
    const CATEGORIES = {
      personal: {
        ingreso: [
          { id: "salario", name: "Salario", icon: "briefcase", color: "#1E3A8A" },
          { id: "freelance", name: "Freelance", icon: "laptop", color: "#6366F1" },
          { id: "inversion", name: "Inversión", icon: "trending-up", color: "#10B981" },
          { id: "regalo", name: "Regalo", icon: "gift", color: "#F59E0B" },
          { id: "otro_ing", name: "Otro", icon: "plus-circle", color: "#64748B" },
        ],
        gasto: [
          { id: "comida", name: "Comida", icon: "utensils", color: "#F59E0B" },
          { id: "transporte", name: "Transporte", icon: "car", color: "#3B82F6" },
          { id: "hogar", name: "Hogar", icon: "home", color: "#8B5CF6" },
          { id: "salud", name: "Salud", icon: "heart", color: "#EF4444" },
          { id: "entretenimiento", name: "Ocio", icon: "popcorn", color: "#EC4899" },
          { id: "compras", name: "Compras", icon: "shopping-bag", color: "#F97316" },
          { id: "servicios", name: "Servicios", icon: "zap", color: "#EAB308" },
          { id: "otro_gasto", name: "Otro", icon: "more-horizontal", color: "#64748B" },
        ],
      },
      empresa: {
        ingreso: [
          { id: "ventas", name: "Ventas", icon: "shopping-cart", color: "#1E3A8A" },
          { id: "servicios_prestados", name: "Servicios", icon: "briefcase", color: "#6366F1" },
          { id: "otros_ing_e", name: "Otros ingresos", icon: "plus-circle", color: "#10B981" },
        ],
        gasto: [
          { id: "nomina", name: "Nómina", icon: "users", color: "#EF4444" },
          { id: "renta", name: "Renta", icon: "building-2", color: "#8B5CF6" },
          { id: "marketing", name: "Marketing", icon: "megaphone", color: "#EC4899" },
          { id: "suministros", name: "Suministros", icon: "package", color: "#F97316" },
          { id: "servicios_e", name: "Servicios", icon: "zap", color: "#EAB308" },
          { id: "impuestos", name: "Impuestos", icon: "landmark", color: "#64748B" },
          { id: "otro_gasto_e", name: "Otro", icon: "more-horizontal", color: "#94A3B8" },
        ],
      },
    };

    const THEMES = {
      soft: {
        label: "Neutro / Soft", bg: "#F8F9FA", card: "#FFFFFF", primary: "#1E3A8A",
        primarySoft: "#E9EEFB", accent: "#F59E0B", success: "#10B981", danger: "#EF4444",
        text: "#111827", textMuted: "#6B7280", border: "#E5E7EB", nav: "#FFFFFF",
      },
      navy: {
        label: "Azul Marino", bg: "#EEF2FB", card: "#FFFFFF", primary: "#0B1E4D",
        primarySoft: "#DCE4F7", accent: "#F59E0B", success: "#10B981", danger: "#EF4444",
        text: "#0B1E4D", textMuted: "#5B6B93", border: "#D9E1F5", nav: "#FFFFFF",
      },
      green: {
        label: "Verde Clásico", bg: "#F1FAF5", card: "#FFFFFF", primary: "#065F46",
        primarySoft: "#DBF3E7", accent: "#F59E0B", success: "#10B981", danger: "#EF4444",
        text: "#0F2C22", textMuted: "#5C7A6E", border: "#DAEEE3", nav: "#FFFFFF",
      },
      dark: {
        label: "Modo Oscuro", bg: "#0B0F19", card: "#131A2A", primary: "#5B7CFA",
        primarySoft: "#1D2440", accent: "#FBBF24", success: "#34D399", danger: "#F87171",
        text: "#F3F4F6", textMuted: "#93A0B8", border: "#232B3E", nav: "#131A2A",
      },
    };

    function todayISO() { return new Date().toISOString().slice(0, 10); }
    function monthKey(dateStr) { return (dateStr || todayISO()).slice(0, 7); }
    function fmt(n, currency = "USD") {
      const v = Number.isFinite(n) ? n : 0;
      try { return new Intl.NumberFormat("es-MX", { style: "currency", currency, maximumFractionDigits: 0 }).format(v); }
      catch { return `$${v.toFixed(0)}`; }
    }

    function Card({ th, className = "", children, style = {} }) {
      return (
        <div className={`rounded-3xl p-4 shadow-[0_6px_24px_-8px_rgba(17,24,39,0.15)] ${className}`} style={{ background: th.card, border: `1px solid ${th.border}`, ...style }}>
          {children}
        </div>
      );
    }

    /* APLICACIÓN PRINCIPAL */
    function App() {
      const [loaded, setLoaded] = useState(false);
      const [userName, setUserName] = useState("");
      const [mode, setMode] = useState("personal");
      const [themeKey, setThemeKey] = useState("soft");
      const [currency, setCurrency] = useState("USD");
      const [transactions, setTransactions] = useState([]);
      const [amount, setAmount] = useState("");
      const [category, setCategory] = useState("comida");
      const [type, setType] = useState("gasto");
      const [note, setNote] = useState("");

      const th = THEMES[themeKey] || THEMES.soft;

      useEffect(() => {
        Store.load().then((data) => {
          if (data) {
            setUserName(data.userName || "");
            setMode(data.mode || "personal");
            setTransactions(data.transactions || []);
          }
          setLoaded(true);
        });
      }, []);

      useEffect(() => {
        if (loaded) {
          Store.save({ userName, mode, transactions });
        }
      }, [userName, mode, transactions, loaded]);

      const handleAddTransaction = (e) => {
        e.preventDefault();
        if (!amount || isNaN(amount)) return;
        const newTx = {
          id: Date.now().toString(),
          amount: parseFloat(amount),
          type,
          category,
          note,
          date: todayISO(),
        };
        setTransactions([newTx, ...transactions]);
        setAmount("");
        setNote("");
      };

      const totalIngresos = useMemo(() => transactions.filter(t => t.type === "ingreso").reduce((acc, t) => acc + t.amount, 0), [transactions]);
      const totalGastos = useMemo(() => transactions.filter(t => t.type === "gasto").reduce((acc, t) => acc + t.amount, 0), [transactions]);

      if (!loaded) return <div className="flex items-center justify-center h-screen font-bold text-slate-600">Cargando FinanzaPro AI...</div>;

      return (
        <div className="min-h-screen pb-12 transition-colors duration-200" style={{ background: th.bg, color: th.text }}>
          {/* Top Bar */}
          <div className="p-4 flex items-center justify-between shadow-sm sticky top-0 z-10" style={{ background: th.card, borderBottom: `1px solid ${th.border}` }}>
            <div className="flex items-center gap-2">
              <div className="w-8 h-8 rounded-xl flex items-center justify-center text-white" style={{ background: th.primary }}>
                <LucideIcon name="sparkles" size={18} color="#ffffff" />
              </div>
              <div>
                <h1 className="font-extrabold text-base leading-none">FinanzaPro AI</h1>
                <p className="text-[10px] mt-0.5" style={{ color: th.textMuted }}>Modo {mode === "personal" ? "Personal" : "Empresa"}</p>
              </div>
            </div>
            <button onClick={() => setThemeKey(themeKey === "soft" ? "dark" : "soft")} className="p-2 rounded-xl" style={{ background: th.primarySoft }}>
              <LucideIcon name={themeKey === "soft" ? "moon" : "sun"} size={18} color={th.primary} />
            </button>
          </div>

          <div className="max-w-md mx-auto p-4 space-y-4">
            {/* Balance Card */}
            <Card th={th} className="!p-6 text-center">
              <p className="text-xs font-semibold uppercase tracking-wider mb-1" style={{ color: th.textMuted }}>Balance Total</p>
              <h2 className="text-3xl font-extrabold mb-4">{fmt(totalIngresos - totalGastos, currency)}</h2>
              
              <div className="grid grid-cols-2 gap-3 pt-3" style={{ borderTop: `1px solid ${th.border}` }}>
                <div className="text-left">
                  <p className="text-xs" style={{ color: th.textMuted }}>Ingresos</p>
                  <p className="font-bold text-sm" style={{ color: th.success }}>+{fmt(totalIngresos, currency)}</p>
                </div>
                <div className="text-right">
                  <p className="text-xs" style={{ color: th.textMuted }}>Gastos</p>
                  <p className="font-bold text-sm" style={{ color: th.danger }}>-{fmt(totalGastos, currency)}</p>
                </div>
              </div>
            </Card>

            {/* Selector de Modo */}
            <div className="flex p-1 rounded-2xl" style={{ background: th.primarySoft }}>
              <button onClick={() => setMode("personal")} className="flex-1 py-2 rounded-xl font-bold text-xs transition-all" style={{ background: mode === "personal" ? th.primary : "transparent", color: mode === "personal" ? "#fff" : th.primary }}>
                Personal
              </button>
              <button onClick={() => setMode("empresa")} className="flex-1 py-2 rounded-xl font-bold text-xs transition-all" style={{ background: mode === "empresa" ? th.primary : "transparent", color: mode === "empresa" ? "#fff" : th.primary }}>
                Empresa
              </button>
            </div>

            {/* Formulario */}
            <Card th={th}>
              <h3 className="font-bold mb-3 text-sm">Registrar Movimiento</h3>
              <form onSubmit={handleAddTransaction} className="space-y-3">
                <div className="flex gap-2">
                  <button type="button" onClick={() => setType("gasto")} className="flex-1 py-2 rounded-xl font-bold text-xs transition-colors" style={{ background: type === "gasto" ? th.danger : th.primarySoft, color: type === "gasto" ? "#fff" : th.text }}>Gasto</button>
                  <button type="button" onClick={() => setType("ingreso")} className="flex-1 py-2 rounded-xl font-bold text-xs transition-colors" style={{ background: type === "ingreso" ? th.success : th.primarySoft, color: type === "ingreso" ? "#fff" : th.text }}>Ingreso</button>
                </div>
                <input type="number" placeholder="Monto ($)" value={amount} onChange={(e) => setAmount(e.target.value)} className="w-full p-3 rounded-xl text-sm outline-none border" style={{ background: th.bg, borderColor: th.border, color: th.text }} required />
                <input type="text" placeholder="Nota / Concepto (ej. Almuerzo)" value={note} onChange={(e) => setNote(e.target.value)} className="w-full p-3 rounded-xl text-sm outline-none border" style={{ background: th.bg, borderColor: th.border, color: th.text }} />
                <button type="submit" className="w-full py-3.5 rounded-xl font-bold text-sm text-white shadow-md active:scale-[0.99] transition-transform" style={{ background: th.primary }}>Guardar Movimiento</button>
              </form>
            </Card>

            {/* Historial */}
            <Card th={th}>
              <h3 className="font-bold mb-3 text-sm">Historial Reciente</h3>
              {transactions.length === 0 ? (
                <p className="text-xs text-center py-4" style={{ color: th.textMuted }}>No hay movimientos registrados aún.</p>
              ) : (
                <div className="space-y-2 max-h-60 overflow-y-auto">
                  {transactions.map((t) => (
                    <div key={t.id} className="flex items-center justify-between p-3 rounded-xl" style={{ background: th.bg }}>
                      <div className="flex items-center gap-2.5">
                        <div className="w-8 h-8 rounded-xl flex items-center justify-center" style={{ background: t.type === "ingreso" ? `${th.success}20` : `${th.danger}20` }}>
                          <LucideIcon name={t.type === "ingreso" ? "arrow-up-right" : "arrow-down-right"} size={16} color={t.type === "ingreso" ? th.success : th.danger} />
                        </div>
                        <div>
                          <p className="font-bold text-xs capitalize">{t.note || t.category}</p>
                          <p className="text-[10px]" style={{ color: th.textMuted }}>{t.date}</p>
                        </div>
                      </div>
                      <span className="font-extrabold text-xs" style={{ color: t.type === "ingreso" ? th.success : th.danger }}>
                        {t.type === "ingreso" ? "+" : "-"}{fmt(t.amount, currency)}
                      </span>
                    </div>
                  ))}
                </div>
              )}
            </Card>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
