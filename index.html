<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>FinanzaPro AI</title>
  <meta name="description" content="Finanzas personales y de microempresa con IA integrada." />

  <!-- Metadatos PWA -->
  <meta name="theme-color" content="#1E3A8A" />
  <meta name="color-scheme" content="light" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="application-name" content="FinanzaPro AI" />

  <!-- Estilos base y Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    :root { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #F8F9FA;
      -webkit-tap-highlight-color: transparent;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen">
  <div id="app" className="max-w-md mx-auto min-h-screen flex flex-col">
    <!-- Header principal -->
    <header class="p-4 bg-white border-b border-slate-200 flex items-center justify-between sticky top-0 z-10 shadow-sm">
      <div class="flex items-center gap-2">
        <div class="w-8 h-8 rounded-xl bg-blue-900 flex items-center justify-center text-white font-bold text-sm">
          FP
        </div>
        <div>
          <h1 class="font-extrabold text-base leading-none text-slate-900">FinanzaPro AI</h1>
          <p class="text-[10px] text-slate-500 mt-0.5">Control Financiero Inteligente</p>
        </div>
      </div>
      <span class="text-xs bg-emerald-100 text-emerald-800 font-bold px-2.5 py-1 rounded-full">Activo</span>
    </header>

    <!-- Contenido Dashboard -->
    <main class="p-4 space-y-4 flex-1">
      <!-- Card Balance -->
      <div class="bg-white rounded-3xl p-6 shadow-sm border border-slate-200 text-center">
        <p class="text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1">Balance Total</p>
        <h2 id="total-balance" class="text-3xl font-extrabold text-slate-900 mb-4">$0</h2>
        
        <div class="grid grid-cols-2 gap-3 pt-3 border-t border-slate-100">
          <div class="text-left">
            <p class="text-xs text-slate-500">Ingresos</p>
            <p id="total-income" class="font-bold text-sm text-emerald-600">+$0</p>
          </div>
          <div class="text-right">
            <p class="text-xs text-slate-500">Gastos</p>
            <p id="total-expenses" class="font-bold text-sm text-rose-600">-$0</p>
          </div>
        </div>
      </div>

      <!-- Formulario de Registro -->
      <div class="bg-white rounded-3xl p-5 shadow-sm border border-slate-200">
        <h3 class="font-bold mb-3 text-sm text-slate-800">Registrar Movimiento</h3>
        <form id="tx-form" class="space-y-3">
          <div class="flex gap-2">
            <button type="button" id="btn-gasto" class="flex-1 py-2 rounded-xl font-bold text-xs bg-rose-600 text-white transition-colors">Gasto</button>
            <button type="button" id="btn-ingreso" class="flex-1 py-2 rounded-xl font-bold text-xs bg-slate-100 text-slate-700 transition-colors">Ingreso</button>
          </div>
          <input type="number" id="tx-amount" placeholder="Monto ($)" class="w-full p-3 rounded-xl text-sm outline-none border border-slate-200 bg-slate-50 focus:bg-white focus:border-blue-900" required />
          <input type="text" id="tx-note" placeholder="Concepto (ej. Comida, Nómina)" class="w-full p-3 rounded-xl text-sm outline-none border border-slate-200 bg-slate-50 focus:bg-white focus:border-blue-900" required />
          <button type="submit" class="w-full py-3.5 rounded-xl font-bold text-sm bg-blue-900 text-white shadow-md active:scale-[0.99] transition-transform">Guardar Movimiento</button>
        </form>
      </div>

      <!-- Historial de Movimientos -->
      <div class="bg-white rounded-3xl p-5 shadow-sm border border-slate-200">
        <h3 class="font-bold mb-3 text-sm text-slate-800">Historial Reciente</h3>
        <div id="tx-list" class="space-y-2 max-h-60 overflow-y-auto text-xs">
          <p class="text-slate-400 text-center py-4">No hay movimientos registrados aún.</p>
        </div>
      </div>
    </main>
  </div>

  <script>
    // Lógica JavaScript Nativa (Garantiza 0 pantallas en blanco)
    let currentType = 'gasto';
    let transactions = JSON.parse(localStorage.getItem('finanzapro_txs')) || [];

    const btnGasto = document.getElementById('btn-gasto');
    const btnIngreso = document.getElementById('btn-ingreso');
    const form = document.getElementById('tx-form');

    btnGasto.addEventListener('click', () => {
      currentType = 'gasto';
      btnGasto.className = 'flex-1 py-2 rounded-xl font-bold text-xs bg-rose-600 text-white transition-colors';
      btnIngreso.className = 'flex-1 py-2 rounded-xl font-bold text-xs bg-slate-100 text-slate-700 transition-colors';
    });

    btnIngreso.addEventListener('click', () => {
      currentType = 'ingreso';
      btnIngreso.className = 'flex-1 py-2 rounded-xl font-bold text-xs bg-emerald-600 text-white transition-colors';
      btnGasto.className = 'flex-1 py-2 rounded-xl font-bold text-xs bg-slate-100 text-slate-700 transition-colors';
    });

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const amount = parseFloat(document.getElementById('tx-amount').value);
      const note = document.getElementById('tx-note').value;

      if (!amount) return;

      transactions.unshift({
        id: Date.now(),
        type: currentType,
        amount: amount,
        note: note,
        date: new Date().toLocaleDateString('es-MX')
      });

      localStorage.setItem('finanzapro_txs', JSON.stringify(transactions));
      document.getElementById('tx-amount').value = '';
      document.getElementById('tx-note').value = '';
      render();
    });

    function render() {
      const income = transactions.filter(t => t.type === 'ingreso').reduce((a, b) => a + b.amount, 0);
      const expenses = transactions.filter(t => t.type === 'gasto').reduce((a, b) => a + b.amount, 0);
      const balance = income - expenses;

      document.getElementById('total-balance').textContent = `$${balance.toLocaleString('es-MX')}`;
      document.getElementById('total-income').textContent = `+$${income.toLocaleString('es-MX')}`;
      document.getElementById('total-expenses').textContent = `-$${expenses.toLocaleString('es-MX')}`;

      const listContainer = document.getElementById('tx-list');
      if (transactions.length === 0) {
        listContainer.innerHTML = '<p class="text-slate-400 text-center py-4">No hay movimientos registrados aún.</p>';
      } else {
        listContainer.innerHTML = transactions.map(t => `
          <div class="flex items-center justify-between p-3 rounded-xl bg-slate-50">
            <div>
              <p class="font-bold text-slate-800">${t.note}</p>
              <p class="text-[10px] text-slate-400">${t.date}</p>
            </div>
            <span class="font-extrabold ${t.type === 'ingreso' ? 'text-emerald-600' : 'text-rose-600'}">
              ${t.type === 'ingreso' ? '+' : '-'}$${t.amount.toLocaleString('es-MX')}
            </span>
          </div>
        `).join('');
      }
    }

    render();
  </script>
</body>
</html>
